name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Vet, Test & Build
        run: make all
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: change-timezone
          path: dist/
